services:
  - type: web
    name: downloader-bot
    runtime: python
    plan: free
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      mkdir -p /opt/render/.deno/bin
      curl -fsSL https://github.com/denoland/deno/releases/latest/download/deno-x86_64-unknown-linux-gnu.zip -o /tmp/deno.zip
      unzip -o /tmp/deno.zip -d /opt/render/.deno/bin/
      chmod +x /opt/render/.deno/bin/deno
    startCommand: python botv2.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DENO_INSTALL
        value: "/opt/render/.deno"
      - key: PATH
        value: "/opt/render/.deno/bin:/usr/local/bin:/usr/bin:/bin"
